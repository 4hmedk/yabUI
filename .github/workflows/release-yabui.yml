name: Release yabUI

on:
  push:
    tags:
      - 'yabUI-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Build universal Yabai runtime
        run: make install

      - name: Build yabUI app
        env:
          YABAI_BIN: ${{ github.workspace }}/bin/yabai
        run: ./yabUI/scripts/build_app.sh

      - name: Package installer
        run: |
          ./yabUI/scripts/package_dmg.sh
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' yabUI/dist/yabUI.app/Contents/Info.plist)"
          ditto -c -k --sequesterRsrc --keepParent \
            yabUI/dist/yabUI.app "yabUI/dist/yabUI-${VERSION}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            yabUI/dist/yabUI-*.dmg
            yabUI/dist/yabUI-*.zip
